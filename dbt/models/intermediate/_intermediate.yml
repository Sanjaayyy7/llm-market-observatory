version: 2
models:
  - name: fct_arena_rank
    columns:
      - {name: canonical_model_id, data_tests: [not_null]}
      - {name: publish_date, data_tests: [not_null]}
      - {name: rank, data_tests: [not_null]}
      - {name: rank_percentile, data_tests: [not_null]}
      - {name: method_era, data_tests: [not_null]}
    data_tests:
      - unique: {arguments: {column_name: "(canonical_model_id || '|' || publish_date)"}}
  - name: int_crosswalk_coverage
    description: One row per in-scope Arena name with its coverage flag (meaningful on dev only; CI fixtures are a handful of rows).
    columns:
      - {name: model_name, data_tests: [unique, not_null]}
      - {name: covered, data_tests: [not_null]}
