version: 2
sources:
  - name: raw
    description: Parquet written by ingest/ (never by dbt). Paths come from var('raw_root') (default ../tests/fixtures/raw on target ci, else ../data/raw).
    meta:
      external_location: "read_parquet('{{ var('raw_root', '../tests/fixtures/raw' if target.name == 'ci' else '../data/raw') }}/{name}/*/part.parquet', hive_partitioning=true)"
    tables:
      - name: litellm
      - name: arena
      - name: epoch
      - name: pypi
      - name: tokencanopy
      - name: freshness
        meta:
          external_location: "read_parquet('{{ var('raw_root', '../tests/fixtures/raw' if target.name == 'ci' else '../data/raw') }}/_freshness.parquet')"
