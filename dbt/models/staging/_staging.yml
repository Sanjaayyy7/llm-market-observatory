version: 2
models:
  - name: stg_litellm__snapshots
    columns:
      - {name: model_key, data_tests: [not_null]}
      - {name: commit_ts, data_tests: [not_null]}
      - {name: snapshot_date, data_tests: [not_null]}
    data_tests:
      - unique: {arguments: {column_name: "(snapshot_date || '|' || model_key)"}}
  - name: stg_arena__leaderboard
    data_tests:
      - unique: {arguments: {column_name: "(config || '|' || publish_date || '|' || model_name || '|' || category)"}}
  - name: stg_epoch__models
    columns:
      - {name: model, data_tests: [unique]}
  - name: stg_pypi__downloads
    data_tests:
      - unique: {arguments: {column_name: "(date || '|' || project)"}}
  - name: stg_tokencanopy__prices
    data_tests:
      - unique: {arguments: {column_name: "(run_date || '|' || platform || '|' || model_slug)"}}
  - name: source_freshness
    columns:
      - {name: source, data_tests: [unique, not_null]}
