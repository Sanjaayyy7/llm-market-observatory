version: 2
models:
  - name: dim_model_price
    columns:
      - {name: model_key, data_tests: [not_null]}
      - {name: valid_from, data_tests: [not_null]}
      - name: delisted
        description: >-
          The version ended because the key left the in-scope set: removed from LiteLLM, or
          reclassified out of chat/completion/responses (41 keys on 2026-11-16). A later version of
          the same key means it returned. Survival censors only at a final delisting (Task 6).
    data_tests:
      - unique: {arguments: {column_name: "(model_key || '|' || valid_from)"}}
      - no_overlapping_intervals: {arguments: {key: model_key, from_col: valid_from, to_col: valid_to}}
  - name: dim_model
    description: Canonical model list (draft until approved at G2); one row per canonical_model_id.
    columns:
      - {name: canonical_model_id, data_tests: [unique, not_null]}
  - name: fct_model_price_daily
    description: Blended USD per Mtok per canonical model and snapshot day (first-party, non-alias keys).
    columns:
      - {name: canonical_model_id, data_tests: [not_null]}
      - {name: date, data_tests: [not_null]}
      - {name: blended_per_mtok, data_tests: [not_null]}
    data_tests:
      - unique: {arguments: {column_name: "(canonical_model_id || '|' || date)"}}
  - name: fct_price_change
    description: One row per change in a canonical model's blended price; is_cut is the raw -10% flag, is_correction the spike rule.
    columns:
      - {name: canonical_model_id, data_tests: [not_null]}
      - {name: change_ts, data_tests: [not_null]}
      - {name: pct, data_tests: [not_null]}
      - {name: is_cut, data_tests: [not_null]}
      - {name: is_correction, data_tests: [not_null]}
    data_tests:
      - unique: {arguments: {column_name: "(canonical_model_id || '|' || change_ts)"}}
  - name: mart_top_tier_screen
    description: One row per canonical model in the key set; unranked and never-priced ones are excluded from survival and counted.
    columns:
      - {name: canonical_model_id, data_tests: [unique, not_null]}
      - {name: listed_at, description: null when the model was never list-priced (free or null price)}
      - {name: is_top_tier, data_tests: [not_null]}
      - {name: is_unranked, data_tests: [not_null]}
  - name: mart_launch_price_survival
    description: Top-tier canonical models, time at launch price, censored at the final delisting, a reroute or the run date.
    columns:
      - {name: canonical_model_id, data_tests: [unique, not_null]}
      - {name: provider, data_tests: [not_null]}
      - {name: listed_at, data_tests: [not_null]}
      - {name: days_at_launch_price, data_tests: [not_null]}
      - {name: censored, data_tests: [not_null]}
  - name: mart_cut_audit
    description: Audited cuts with provider-announced date and commit lag; headline uses the median lag_days over non-data-fix rows.
    columns:
      - {name: canonical_model_id, data_tests: [unique, not_null]}
      - {name: observed_ts, data_tests: [not_null]}
      - {name: source_url, data_tests: [not_null]}
      - {name: is_data_fix, data_tests: [not_null]}
