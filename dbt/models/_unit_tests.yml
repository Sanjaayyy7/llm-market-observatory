version: 2

unit_tests:
  # ---- dim_model_price (mocks ref('stg_litellm__snapshots')) ----
  - name: change
    description: a price change opens a new version
    model: dim_model_price
    given:
      - input: ref('stg_litellm__snapshots')
        rows:
          - {snapshot_date: "2024-01-01", commit_sha: a, commit_ts: "2024-01-01 10:00:00+00", model_key: m, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 2}
          - {snapshot_date: "2024-01-02", commit_sha: b, commit_ts: "2024-01-02 10:00:00+00", model_key: m, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 3}
    expect:
      rows:
        - {model_key: m, valid_from: "2024-01-01 10:00:00+00", valid_to: "2024-01-02 10:00:00+00", in_per_mtok: 1, out_per_mtok: 2, delisted: false, is_current: false}
        - {model_key: m, valid_from: "2024-01-02 10:00:00+00", valid_to: null, in_per_mtok: 1, out_per_mtok: 3, delisted: false, is_current: true}

  - name: revert
    description: A to B to A gives 3 versions
    model: dim_model_price
    given:
      - input: ref('stg_litellm__snapshots')
        rows:
          - {snapshot_date: "2024-01-01", commit_sha: a, commit_ts: "2024-01-01 10:00:00+00", model_key: m, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 2}
          - {snapshot_date: "2024-01-02", commit_sha: b, commit_ts: "2024-01-02 10:00:00+00", model_key: m, litellm_provider: p, mode: chat, in_per_mtok: 5, out_per_mtok: 2}
          - {snapshot_date: "2024-01-03", commit_sha: c, commit_ts: "2024-01-03 10:00:00+00", model_key: m, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 2}
    expect:
      rows:
        - {model_key: m, valid_from: "2024-01-01 10:00:00+00", valid_to: "2024-01-02 10:00:00+00", in_per_mtok: 1, out_per_mtok: 2, delisted: false, is_current: false}
        - {model_key: m, valid_from: "2024-01-02 10:00:00+00", valid_to: "2024-01-03 10:00:00+00", in_per_mtok: 5, out_per_mtok: 2, delisted: false, is_current: false}
        - {model_key: m, valid_from: "2024-01-03 10:00:00+00", valid_to: null, in_per_mtok: 1, out_per_mtok: 2, delisted: false, is_current: true}

  - name: deletion
    description: absence sets valid_to to the first absent snapshot and delisted
    model: dim_model_price
    given:
      - input: ref('stg_litellm__snapshots')
        rows:
          - {snapshot_date: "2024-01-01", commit_sha: a, commit_ts: "2024-01-01 10:00:00+00", model_key: m, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 2}
          - {snapshot_date: "2024-01-01", commit_sha: a, commit_ts: "2024-01-01 10:00:00+00", model_key: keep, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 2}
          - {snapshot_date: "2024-01-02", commit_sha: b, commit_ts: "2024-01-02 10:00:00+00", model_key: keep, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 2}
    expect:
      rows:
        - {model_key: m, valid_from: "2024-01-01 10:00:00+00", valid_to: "2024-01-02 10:00:00+00", in_per_mtok: 1, out_per_mtok: 2, delisted: true, is_current: false}
        - {model_key: keep, valid_from: "2024-01-01 10:00:00+00", valid_to: null, in_per_mtok: 1, out_per_mtok: 2, delisted: false, is_current: true}

  - name: reappearance
    description: absence then return opens a new version, even at an equal price
    model: dim_model_price
    given:
      - input: ref('stg_litellm__snapshots')
        rows:
          - {snapshot_date: "2024-01-01", commit_sha: a, commit_ts: "2024-01-01 10:00:00+00", model_key: m, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 2}
          - {snapshot_date: "2024-01-01", commit_sha: a, commit_ts: "2024-01-01 10:00:00+00", model_key: keep, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 2}
          - {snapshot_date: "2024-01-02", commit_sha: b, commit_ts: "2024-01-02 10:00:00+00", model_key: keep, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 2}
          - {snapshot_date: "2024-01-03", commit_sha: c, commit_ts: "2024-01-03 10:00:00+00", model_key: m, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 2}
          - {snapshot_date: "2024-01-03", commit_sha: c, commit_ts: "2024-01-03 10:00:00+00", model_key: keep, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 2}
    expect:
      rows:
        - {model_key: m, valid_from: "2024-01-01 10:00:00+00", valid_to: "2024-01-02 10:00:00+00", in_per_mtok: 1, out_per_mtok: 2, delisted: true, is_current: false}
        - {model_key: m, valid_from: "2024-01-03 10:00:00+00", valid_to: null, in_per_mtok: 1, out_per_mtok: 2, delisted: false, is_current: true}
        - {model_key: keep, valid_from: "2024-01-01 10:00:00+00", valid_to: null, in_per_mtok: 1, out_per_mtok: 2, delisted: false, is_current: true}

  - name: rename
    description: old key delisted, new key listed
    model: dim_model_price
    given:
      - input: ref('stg_litellm__snapshots')
        rows:
          - {snapshot_date: "2024-01-01", commit_sha: a, commit_ts: "2024-01-01 10:00:00+00", model_key: old, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 2}
          - {snapshot_date: "2024-01-02", commit_sha: b, commit_ts: "2024-01-02 10:00:00+00", model_key: new, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 2}
    expect:
      rows:
        - {model_key: old, valid_from: "2024-01-01 10:00:00+00", valid_to: "2024-01-02 10:00:00+00", in_per_mtok: 1, out_per_mtok: 2, delisted: true, is_current: false}
        - {model_key: new, valid_from: "2024-01-02 10:00:00+00", valid_to: null, in_per_mtok: 1, out_per_mtok: 2, delisted: false, is_current: true}

  - name: test_null_mode_key_not_delisted
    description: a key present days 1-2 (mode already resolved by staging) is one version from day 1
    model: dim_model_price
    given:
      - input: ref('stg_litellm__snapshots')
        rows:
          - {snapshot_date: "2024-01-01", commit_sha: a, commit_ts: "2024-01-01 10:00:00+00", model_key: m, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 2}
          - {snapshot_date: "2024-01-02", commit_sha: b, commit_ts: "2024-01-02 10:00:00+00", model_key: m, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 2}
    expect:
      rows:
        - {model_key: m, valid_from: "2024-01-01 10:00:00+00", valid_to: null, in_per_mtok: 1, out_per_mtok: 2, delisted: false, is_current: true}

  - name: test_equal_prices_no_new_version
    description: identical rounded prices on consecutive days give one version
    model: dim_model_price
    given:
      - input: ref('stg_litellm__snapshots')
        rows:
          - {snapshot_date: "2024-01-01", commit_sha: a, commit_ts: "2024-01-01 10:00:00+00", model_key: m, litellm_provider: p, mode: chat, in_per_mtok: 0.15, out_per_mtok: 0.6}
          - {snapshot_date: "2024-01-02", commit_sha: b, commit_ts: "2024-01-02 10:00:00+00", model_key: m, litellm_provider: p, mode: chat, in_per_mtok: 0.15, out_per_mtok: 0.6}
    expect:
      rows:
        - {model_key: m, valid_from: "2024-01-01 10:00:00+00", valid_to: null, in_per_mtok: 0.15, out_per_mtok: 0.6, delisted: false, is_current: true}

  - name: test_null_to_value_is_a_change
    description: null to value on one side while the other side is unchanged opens a new version (in and out)
    model: dim_model_price
    given:
      - input: ref('stg_litellm__snapshots')
        rows:
          - {snapshot_date: "2024-01-01", commit_sha: x, commit_ts: "2024-01-01 10:00:00+00", model_key: k_in, litellm_provider: p, mode: chat, in_per_mtok: null, out_per_mtok: 2}
          - {snapshot_date: "2024-01-02", commit_sha: x, commit_ts: "2024-01-02 10:00:00+00", model_key: k_in, litellm_provider: p, mode: chat, in_per_mtok: 0.5, out_per_mtok: 2}
          - {snapshot_date: "2024-01-01", commit_sha: x, commit_ts: "2024-01-01 10:00:00+00", model_key: k_out, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: null}
          - {snapshot_date: "2024-01-02", commit_sha: x, commit_ts: "2024-01-02 10:00:00+00", model_key: k_out, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 0.5}
    expect:
      rows:
        - {model_key: k_in, valid_from: "2024-01-01 10:00:00+00", valid_to: "2024-01-02 10:00:00+00", in_per_mtok: null, out_per_mtok: 2, delisted: false, is_current: false}
        - {model_key: k_in, valid_from: "2024-01-02 10:00:00+00", valid_to: null, in_per_mtok: 0.5, out_per_mtok: 2, delisted: false, is_current: true}
        - {model_key: k_out, valid_from: "2024-01-01 10:00:00+00", valid_to: "2024-01-02 10:00:00+00", in_per_mtok: 1, out_per_mtok: null, delisted: false, is_current: false}
        - {model_key: k_out, valid_from: "2024-01-02 10:00:00+00", valid_to: null, in_per_mtok: 1, out_per_mtok: 0.5, delisted: false, is_current: true}

  - name: golden_scd2
    description: hand-worked 6-snapshot fixture
    model: dim_model_price
    given:
      - input: ref('stg_litellm__snapshots')
        format: csv
        fixture: golden_stg_snapshots
    expect:
      format: csv
      fixture: golden_dim_model_price

  # ---- stg_litellm__snapshots (mocks source('raw','litellm')) ----
  - name: test_null_mode_takes_next_mode
    description: null mode on day 1 and chat from day 2 gives chat on day 1, so the key survives the filter
    model: stg_litellm__snapshots
    given:
      - input: source('raw', 'litellm')
        format: sql
        rows: |
            select cast('2024-01-01' as date) as snapshot_date, cast('a' as varchar) as commit_sha, cast('2024-01-01 10:00:00+00' as timestamptz) as commit_ts, cast('m' as varchar) as model_key, cast('p' as varchar) as litellm_provider, cast(null as varchar) as mode, cast(1.0e-06 as double) as input_cost_per_token, cast(2.0e-06 as double) as output_cost_per_token union all
            select cast('2024-01-02' as date) as snapshot_date, cast('b' as varchar) as commit_sha, cast('2024-01-02 10:00:00+00' as timestamptz) as commit_ts, cast('m' as varchar) as model_key, cast('p' as varchar) as litellm_provider, cast('chat' as varchar) as mode, cast(1.0e-06 as double) as input_cost_per_token, cast(2.0e-06 as double) as output_cost_per_token union all
            select cast('2024-01-02' as date) as snapshot_date, cast('b' as varchar) as commit_sha, cast('2024-01-02 10:00:00+00' as timestamptz) as commit_ts, cast('emb' as varchar) as model_key, cast('p' as varchar) as litellm_provider, cast('embedding' as varchar) as mode, cast(1.0e-06 as double) as input_cost_per_token, cast(0 as double) as output_cost_per_token
    expect:
      rows:
        - {snapshot_date: "2024-01-01", commit_sha: a, commit_ts: "2024-01-01 10:00:00+00", model_key: m, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 2}
        - {snapshot_date: "2024-01-02", commit_sha: b, commit_ts: "2024-01-02 10:00:00+00", model_key: m, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 2}

  - name: test_mode_fill_and_filter
    description: next-fill before previous-fill, previous fallback, null kept, only chat/completion/responses survive
    model: stg_litellm__snapshots
    given:
      - input: source('raw', 'litellm')
        format: sql
        rows: |
            select cast('2024-01-01' as date) as snapshot_date, cast('x' as varchar) as commit_sha, cast('2024-01-01 10:00:00+00' as timestamptz) as commit_ts, cast('allnull' as varchar) as model_key, cast('p' as varchar) as litellm_provider, cast(null as varchar) as mode, cast(1.0e-06 as double) as input_cost_per_token, cast(2.0e-06 as double) as output_cost_per_token union all
            select cast('2024-01-02' as date) as snapshot_date, cast('x' as varchar) as commit_sha, cast('2024-01-02 10:00:00+00' as timestamptz) as commit_ts, cast('allnull' as varchar) as model_key, cast('p' as varchar) as litellm_provider, cast(null as varchar) as mode, cast(1.0e-06 as double) as input_cost_per_token, cast(2.0e-06 as double) as output_cost_per_token union all
            select cast('2024-01-01' as date) as snapshot_date, cast('x' as varchar) as commit_sha, cast('2024-01-01 10:00:00+00' as timestamptz) as commit_ts, cast('emb_null' as varchar) as model_key, cast('p' as varchar) as litellm_provider, cast('embedding' as varchar) as mode, cast(1.0e-06 as double) as input_cost_per_token, cast(2.0e-06 as double) as output_cost_per_token union all
            select cast('2024-01-02' as date) as snapshot_date, cast('x' as varchar) as commit_sha, cast('2024-01-02 10:00:00+00' as timestamptz) as commit_ts, cast('emb_null' as varchar) as model_key, cast('p' as varchar) as litellm_provider, cast(null as varchar) as mode, cast(1.0e-06 as double) as input_cost_per_token, cast(2.0e-06 as double) as output_cost_per_token union all
            select cast('2024-01-01' as date) as snapshot_date, cast('x' as varchar) as commit_sha, cast('2024-01-01 10:00:00+00' as timestamptz) as commit_ts, cast('comp' as varchar) as model_key, cast('p' as varchar) as litellm_provider, cast('completion' as varchar) as mode, cast(1.0e-06 as double) as input_cost_per_token, cast(2.0e-06 as double) as output_cost_per_token union all
            select cast('2024-01-01' as date) as snapshot_date, cast('x' as varchar) as commit_sha, cast('2024-01-01 10:00:00+00' as timestamptz) as commit_ts, cast('resp' as varchar) as model_key, cast('p' as varchar) as litellm_provider, cast('responses' as varchar) as mode, cast(1.0e-06 as double) as input_cost_per_token, cast(2.0e-06 as double) as output_cost_per_token union all
            select cast('2024-01-01' as date) as snapshot_date, cast('x' as varchar) as commit_sha, cast('2024-01-01 10:00:00+00' as timestamptz) as commit_ts, cast('nullchat' as varchar) as model_key, cast('p' as varchar) as litellm_provider, cast(null as varchar) as mode, cast(1.0e-06 as double) as input_cost_per_token, cast(2.0e-06 as double) as output_cost_per_token union all
            select cast('2024-01-02' as date) as snapshot_date, cast('x' as varchar) as commit_sha, cast('2024-01-02 10:00:00+00' as timestamptz) as commit_ts, cast('nullchat' as varchar) as model_key, cast('p' as varchar) as litellm_provider, cast('chat' as varchar) as mode, cast(1.0e-06 as double) as input_cost_per_token, cast(2.0e-06 as double) as output_cost_per_token union all
            select cast('2024-01-01' as date) as snapshot_date, cast('x' as varchar) as commit_sha, cast('2024-01-01 10:00:00+00' as timestamptz) as commit_ts, cast('chattrail' as varchar) as model_key, cast('p' as varchar) as litellm_provider, cast('chat' as varchar) as mode, cast(1.0e-06 as double) as input_cost_per_token, cast(2.0e-06 as double) as output_cost_per_token union all
            select cast('2024-01-02' as date) as snapshot_date, cast('x' as varchar) as commit_sha, cast('2024-01-02 10:00:00+00' as timestamptz) as commit_ts, cast('chattrail' as varchar) as model_key, cast('p' as varchar) as litellm_provider, cast(null as varchar) as mode, cast(1.0e-06 as double) as input_cost_per_token, cast(2.0e-06 as double) as output_cost_per_token union all
            select cast('2024-01-01' as date) as snapshot_date, cast('x' as varchar) as commit_sha, cast('2024-01-01 10:00:00+00' as timestamptz) as commit_ts, cast('mid' as varchar) as model_key, cast('p' as varchar) as litellm_provider, cast('chat' as varchar) as mode, cast(1.0e-06 as double) as input_cost_per_token, cast(2.0e-06 as double) as output_cost_per_token union all
            select cast('2024-01-02' as date) as snapshot_date, cast('x' as varchar) as commit_sha, cast('2024-01-02 10:00:00+00' as timestamptz) as commit_ts, cast('mid' as varchar) as model_key, cast('p' as varchar) as litellm_provider, cast(null as varchar) as mode, cast(1.0e-06 as double) as input_cost_per_token, cast(2.0e-06 as double) as output_cost_per_token union all
            select cast('2024-01-03' as date) as snapshot_date, cast('x' as varchar) as commit_sha, cast('2024-01-03 10:00:00+00' as timestamptz) as commit_ts, cast('mid' as varchar) as model_key, cast('p' as varchar) as litellm_provider, cast('embedding' as varchar) as mode, cast(1.0e-06 as double) as input_cost_per_token, cast(2.0e-06 as double) as output_cost_per_token
    expect:
      rows:
        - {snapshot_date: "2024-01-01", commit_sha: x, commit_ts: "2024-01-01 10:00:00+00", model_key: allnull, litellm_provider: p, mode: null, in_per_mtok: 1, out_per_mtok: 2}
        - {snapshot_date: "2024-01-02", commit_sha: x, commit_ts: "2024-01-02 10:00:00+00", model_key: allnull, litellm_provider: p, mode: null, in_per_mtok: 1, out_per_mtok: 2}
        - {snapshot_date: "2024-01-01", commit_sha: x, commit_ts: "2024-01-01 10:00:00+00", model_key: comp, litellm_provider: p, mode: completion, in_per_mtok: 1, out_per_mtok: 2}
        - {snapshot_date: "2024-01-01", commit_sha: x, commit_ts: "2024-01-01 10:00:00+00", model_key: resp, litellm_provider: p, mode: responses, in_per_mtok: 1, out_per_mtok: 2}
        - {snapshot_date: "2024-01-01", commit_sha: x, commit_ts: "2024-01-01 10:00:00+00", model_key: nullchat, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 2}
        - {snapshot_date: "2024-01-02", commit_sha: x, commit_ts: "2024-01-02 10:00:00+00", model_key: nullchat, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 2}
        - {snapshot_date: "2024-01-01", commit_sha: x, commit_ts: "2024-01-01 10:00:00+00", model_key: chattrail, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 2}
        - {snapshot_date: "2024-01-02", commit_sha: x, commit_ts: "2024-01-02 10:00:00+00", model_key: chattrail, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 2}
        - {snapshot_date: "2024-01-01", commit_sha: x, commit_ts: "2024-01-01 10:00:00+00", model_key: mid, litellm_provider: p, mode: chat, in_per_mtok: 1, out_per_mtok: 2}

  - name: test_float_noise_rounds_equal
    description: 1.5e-07 and 1.4999999e-07 both give 0.15 per 1M
    model: stg_litellm__snapshots
    given:
      - input: source('raw', 'litellm')
        format: sql
        rows: |
            select cast('2024-01-01' as date) as snapshot_date, cast('a' as varchar) as commit_sha, cast('2024-01-01 10:00:00+00' as timestamptz) as commit_ts, cast('m' as varchar) as model_key, cast('p' as varchar) as litellm_provider, cast('chat' as varchar) as mode, cast(1.5e-07 as double) as input_cost_per_token, cast(6.0e-07 as double) as output_cost_per_token union all
            select cast('2024-01-02' as date) as snapshot_date, cast('b' as varchar) as commit_sha, cast('2024-01-02 10:00:00+00' as timestamptz) as commit_ts, cast('m' as varchar) as model_key, cast('p' as varchar) as litellm_provider, cast('chat' as varchar) as mode, cast(1.4999999e-07 as double) as input_cost_per_token, cast(6.0e-07 as double) as output_cost_per_token
    expect:
      rows:
        - {snapshot_date: "2024-01-01", commit_sha: a, commit_ts: "2024-01-01 10:00:00+00", model_key: m, litellm_provider: p, mode: chat, in_per_mtok: 0.15, out_per_mtok: 0.6}
        - {snapshot_date: "2024-01-02", commit_sha: b, commit_ts: "2024-01-02 10:00:00+00", model_key: m, litellm_provider: p, mode: chat, in_per_mtok: 0.15, out_per_mtok: 0.6}

  - name: test_freshness_allowance_and_sla
    description: lag = sla+1 fresh, sla+2 stale; null-SLA lag 1 fresh, lag 2 stale; probe rows ignored; anchored to run_ts
    model: source_freshness
    given:
      - input: ref('stg_litellm__snapshots')
        format: sql
        rows: |
            select cast('2026-11-09' as date) as snapshot_date union all
            select cast('2026-11-11' as date) as snapshot_date union all
            select cast('2026-11-13' as date) as snapshot_date
      - input: ref('stg_arena__leaderboard')
        format: sql
        rows: |
            select cast('2026-11-08' as date) as publish_date union all
            select cast('2026-11-10' as date) as publish_date union all
            select cast('2026-11-12' as date) as publish_date
      - input: ref('stg_epoch__models')
        format: sql
        rows: |
            select cast('2026-11-15' as date) as publication_date
      - input: ref('stg_pypi__downloads')
        format: sql
        rows: |
            select cast('2026-11-14' as date) as date
      - input: ref('stg_tokencanopy__prices')
        format: sql
        rows: |
            select cast('2026-11-16' as date) as run_date
      - input: source('raw', 'freshness')
        format: sql
        rows: |
