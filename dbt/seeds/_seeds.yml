version: 2
seeds:
  - name: seed_provider_map
    columns:
      - name: litellm_provider
        data_tests: [unique]
      - name: provider
        data_tests: [not_null]
      - name: is_first_party
        data_tests: [not_null]
  - name: seed_sdk_packages
    columns:
      - name: package
        data_tests: [unique]
      - name: sdk_group
        data_tests: [not_null]
  - name: seed_models
    config:
      column_types:
        family: varchar
        display_name: varchar
        announce_url: varchar
        approved_by: varchar
        announce_date: date
        open_weights: boolean
    columns:
      - name: canonical_model_id
        data_tests: [unique]
      - name: provider
        data_tests: [not_null]
  - name: seed_model_crosswalk
    config:
      column_types:
        evidence_url: varchar
        approved_by: varchar
        match_score: double
        is_moving_alias: boolean
    columns:
      - name: canonical_model_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('seed_models'), field: canonical_model_id}}
      - name: match_score
        data_tests: [not_null]
      - name: match_method
        data_tests:
          - accepted_values: {arguments: {values: [exact, hf_id, manual]}}
      - name: source
        data_tests:
          - accepted_values: {arguments: {values: [litellm, arena, epoch, epoch_insight]}}
    data_tests:
      - unique: {arguments: {column_name: "(source || '|' || source_key)"}}
  - name: seed_provider_domains
    config:
      column_types:
        provider: varchar
        doc_domain: varchar
    columns:
      - name: provider
        data_tests: [not_null]
      - name: doc_domain
        data_tests: [unique]
  - name: seed_model_reroute
    config:
      column_types:
        reroute_date: date
        evidence_url: varchar
        approved_by: varchar
    columns:
      - name: canonical_model_id
        data_tests:
          - unique
          - relationships: {arguments: {to: ref('seed_models'), field: canonical_model_id}}
      - name: target_model_id
        data_tests:
          - relationships: {arguments: {to: ref('seed_models'), field: canonical_model_id}}
  - name: seed_temporary_price
    description: G4 council - provider-documented temporary prices (an end date is stated); a change into one is a correction.
    config:
      column_types:
        observed_ts: timestamptz
        ends_on: date
        evidence_url: varchar
        evidence_quote: varchar
        approved_by: varchar
    columns:
      - name: canonical_model_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('seed_models'), field: canonical_model_id}}
      - name: observed_ts
        data_tests: [not_null]
      - name: ends_on
        data_tests: [not_null]
  - name: seed_cut_audit
    description: G4 hand audit of every real cut (or 20 stratified); announced_date and source_url from provider doc domains only.
    config:
      column_types:
        canonical_model_id: varchar
        observed_ts: timestamptz
        announced_date: date
        source_url: varchar
        is_data_fix: boolean
        evidence_quote: varchar
        verdict: varchar
    columns:
      - name: canonical_model_id
        data_tests:
          - not_null
          - unique
      - name: source_url
        data_tests:
          - not_null: {arguments: {column_name: "nullif(regexp_extract(source_url, '^https://.+', 0), '')"}}
      - name: announced_date
        data_tests:
          - not_null: {arguments: {column_name: "coalesce(announced_date::varchar, case when is_data_fix then 'data fix' end)"}}
      - name: verdict
        description: "G4 council: why a row is or is not a data fix; is_data_fix stays the strict pre-registered flag (verdict != 'announced')"
        data_tests:
          - accepted_values: {arguments: {values: [announced, real_undated, unannounced, no_evidence, reroute]}}
          - not_null: {arguments: {column_name: "case when is_data_fix = (verdict != 'announced') then 1 end"}}
  - name: seed_epoch_candidate_status
    description: G5 - the 36 Epoch GPQA candidates with provider, scope and first-party api_id (co-founder, frozen by the prereg sha256).
    config:
      column_types:
        model_name: varchar
        obs_date: varchar
        provider: varchar
        scope: varchar
        api_id: varchar
        evidence_url: varchar
        note: varchar
    columns:
      - name: scope
        data_tests:
          - accepted_values: {arguments: {values: [in_scope, out_of_scope]}}
    data_tests:
      - unique: {arguments: {column_name: "(model_name || '|' || obs_date)"}}
  - name: seed_epoch_mismatch_audit
    description: G5 audit verdicts for mismatch and changed_then_agrees rows (co-founder, after an Opus reviewer pass).
    config:
      column_types:
        model_name: varchar
        obs_date: varchar
        verdict: varchar
        source_url: varchar
        approved_by: varchar
    columns:
      - name: verdict
        data_tests:
          - accepted_values: {arguments: {values: [epoch_non_list_price, real_change, panel_error]}}
