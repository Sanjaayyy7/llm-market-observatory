[project]
name = "llm-market-observatory"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5,<2",
    "dbt-core~=1.12.6",
    "dbt-duckdb~=1.11.1",
    "pandas>=2.1,<3",
    "pyarrow",
    "lifelines",
    "statsmodels",
    "httpx",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
python-preference = "only-managed"
package = false

[tool.ruff]
extend-exclude = ["docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
