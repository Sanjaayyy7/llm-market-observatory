name: refresh
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: refresh-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v5.0.4
        with:
          path: |
            data/cache/litellm.git
            data/raw
          key: refresh-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: refresh-${{ runner.os }}-
      # The dev build fails on stale sources or unaudited first cuts.
      - run: make all
      - name: Commit refreshed site data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A -- site/src/data/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'data: refresh site exports' -m $'Agent: Codex\nModel: gpt-6.2-sol'
            gh auth setup-git --hostname github.com --force
            git push origin HEAD:refs/heads/main
          fi
      - name: Dispatch Pages
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
